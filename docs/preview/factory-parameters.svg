    <text x="48" y="977" font-size="17" fill="#edf6ff" font-weight="600">03 / 读懂参数关系</text>
    <text x="48" y="1002" font-size="14" fill="#b4c8de" font-weight="400">车轮转速 = 电机转速 ÷ 传动比     轮端扭矩 ≤ 电机扭矩 × 传动比 × 传动效率     驱动力 = 轮端扭矩 ÷ 有效半径</text>
    <text x="48" y="1025" font-size="13" fill="#9eb4cd" font-weight="400">教学边界：电机转速上限推导车速为 106.8 km/h，不是实测极速；试跑起始65%电量，附件700 W，驾驶员75 kg。</text>
  </svg>