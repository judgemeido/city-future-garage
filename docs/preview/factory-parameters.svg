    <text x="511" y="195" font-size="15" fill="#b4c8de" font-weight="400">整备质量</text><text x="511" y="229" font-size="28" fill="#f5bc65" font-weight="700">1311 kg</text><text x="511" y="254" font-size="13" fill="#b4c8de" font-weight="400">含固定设备，不含驾驶员 / 载荷</text><text x="833" y="195" font-size="15" fill="#b4c8de" font-weight="400">低速扭矩上限</text><text x="833" y="229" font-size="28" fill="#f5bc65" font-weight="700">1795.5 N·m</text><text x="833" y="254" font-size="13" fill="#b4c8de" font-weight="400">减速器输出；抓地还会限制驱动力</text><text x="511" y="294" font-size="15" fill="#b4c8de" font-weight="400">保守轮端功率上限</text><text x="511" y="328" font-size="28" fill="#f5bc65" font-weight="700">64.6 kW</text><text x="511" y="353" font-size="13" fill="#b4c8de" font-weight="400">按电机效率84% · 电池供电能力</text><text x="833" y="294" font-size="15" fill="#b4c8de" font-weight="400">工程预算</text><text x="833" y="328" font-size="28" fill="#f5bc65" font-weight="700">134 币</text><text x="833" y="353" font-size="13" fill="#b4c8de" font-weight="400">六大部件总和 · 可自由选装</text>
